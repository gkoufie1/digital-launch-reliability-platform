name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts (supply-chain hardening).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Gate on production dependencies only; dev tooling advisories are tracked via Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    env:
      IMAGE: digital-launch-web:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name web -p 3000:3000 "$IMAGE"

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:3000/api/health && break
            sleep 1
          done

          headers=$(curl -fsS -D - -o body.json http://localhost:3000/api/health)
          cat body.json; echo
          grep -q '"status":"healthy"' body.json
          echo "$headers" | grep -qi '^cache-control: no-store'
          curl -fsS -o /dev/null http://localhost:3000/
          test "$(docker exec web whoami)" = "node"
          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs web || true
